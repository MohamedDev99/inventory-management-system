name: CI Pipeline

# ─────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────
# Global environment variables
# ─────────────────────────────────────────────
env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:

  # ═══════════════════════════════════════════
  # JOB 1 — Backend CI
  # ═══════════════════════════════════════════
  backend:
    name: "Backend — Build & Test"
    runs-on: ubuntu-latest

    # Spin up a PostgreSQL container for integration tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ims_test
          POSTGRES_USER: ims_user
          POSTGRES_PASSWORD: ims_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ims_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── Checkout ──────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Java setup ────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # ── Maven cache ───────────────────────
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── Build & Unit Tests ────────────────
      - name: Build and run unit tests
        working-directory: ./backend
        run: mvn clean test --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ims_test
          SPRING_DATASOURCE_USERNAME: ims_user
          SPRING_DATASOURCE_PASSWORD: ims_password

      # ── Integration Tests ─────────────────
      - name: Run integration tests
        working-directory: ./backend
        run: mvn verify -P integration-tests --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ims_test
          SPRING_DATASOURCE_USERNAME: ims_user
          SPRING_DATASOURCE_PASSWORD: ims_password

      # ── Test Report ───────────────────────
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always() # Run even if tests fail
        with:
          name: Backend Test Results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

      # ── Upload JAR artifact ───────────────
      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ═══════════════════════════════════════════
  # JOB 2 — Frontend CI
  # ═══════════════════════════════════════════
  frontend:
    name: "Frontend — Lint, Test & Build"
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node setup ────────────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Install dependencies ───────────────
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # ── Lint ──────────────────────────────
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      # ── Type check ────────────────────────
      - name: TypeScript type check
        working-directory: ./frontend
        run: npm run type-check

      # ── Unit Tests ────────────────────────
      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test -- --run --reporter=verbose

      # ── Production Build ──────────────────
      - name: Build for production
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:8080' }}

      # ── Upload build artifact ─────────────
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

  # ═══════════════════════════════════════════
  # JOB 3 — Summary (runs after both jobs)
  # ═══════════════════════════════════════════
  ci-summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always() # Always run so we get a summary even on failure

    steps:
      - name: Check CI results
        run: |
          echo "──────────────────────────────────"
          echo "  CI Pipeline Summary"
          echo "──────────────────────────────────"
          echo "  Backend : ${{ needs.backend.result }}"
          echo "  Frontend: ${{ needs.frontend.result }}"
          echo "──────────────────────────────────"

          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed. Blocking merge."
            exit 1
          fi

          echo "✅ All checks passed. Ready for next stage."