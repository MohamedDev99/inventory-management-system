##############################################################################
# .github/workflows/terraform.yml
#
# CI/CD pipeline for Terraform.
#
# TRIGGERS:
#   - Pull Requests → terraform plan (shows reviewers what will change)
#   - Push to main  → terraform apply (deploys to staging automatically)
#   - Manual trigger (workflow_dispatch) → deploy to any environment
#
# AUTHENTICATION:
#   Uses OIDC (OpenID Connect) to authenticate with AWS — no long-lived keys!
#   AWS IAM Role trusts GitHub Actions' OIDC provider.
#   Much safer than storing AWS_ACCESS_KEY_ID in GitHub Secrets.
#
# SETUP REQUIRED:
#   1. Create GitHub OIDC provider in AWS IAM
#   2. Create IAM role with Terraform permissions
#   3. Set TERRAFORM_ROLE_ARN in GitHub repo secrets
##############################################################################

name: Terraform

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev, staging, prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      command:
        description: 'Terraform command'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

env:
  TF_VERSION: '1.6.0'
  AWS_REGION: 'us-east-1'
  WORKING_DIR: './terraform'

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required to checkout code
  pull-requests: write  # Required to post plan as PR comment

jobs:
  # ============================================================================
  # JOB 1: VALIDATE — Check syntax and format on every push
  # ============================================================================
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform fmt -check -recursive
          echo "✅ All .tf files are properly formatted"

      - name: Terraform Init (for validation)
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -backend=false  # Skip backend for validation

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform validate
          echo "✅ Terraform configuration is valid"

  # ============================================================================
  # JOB 2: PLAN — Run on pull requests, post results as PR comment
  # ============================================================================
  plan:
    name: Terraform Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        environment: [dev, staging]  # Plan for both envs on PRs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformPlan-${{ matrix.environment }}-${{ github.run_number }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Select Workspace
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform workspace select ${{ matrix.environment }} || \
          terraform workspace new ${{ matrix.environment }}

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="environments/${{ matrix.environment }}/terraform.tfvars" \
            -input=false \
            -no-color \
            -out=tfplan
        continue-on-error: true  # Don't fail yet — we want to post the output

      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan — \`${{ matrix.environment }}\`

            **Status:** ${{ steps.plan.outcome == 'success' && '✅ Success' || '❌ Failed' }}

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Triggered by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ============================================================================
  # JOB 3: APPLY to DEV — Runs on merge to develop branch
  # ============================================================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: dev  # GitHub environment for approval gates (optional)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Select Dev Workspace
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform workspace select dev || terraform workspace new dev

      - name: Terraform Apply — Dev
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform apply \
            -var-file="environments/dev/terraform.tfvars" \
            -input=false \
            -auto-approve

      - name: Show Outputs
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform output deployment_summary

  # ============================================================================
  # JOB 4: APPLY to PROD — Manual trigger only, requires approval
  # ============================================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod' &&
      github.event.inputs.command == 'apply'
    environment: production  # Requires manual approval in GitHub Environments

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN_PROD }}  # Separate prod role!
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Select Prod Workspace
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform workspace select prod || terraform workspace new prod

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="environments/prod/terraform.tfvars" \
            -input=false \
            -out=tfplan-prod

      - name: Terraform Apply — Production
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply tfplan-prod

      - name: Show Outputs
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform output deployment_summary
