apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inventory-app-alerts
  namespace: inventory-app
  labels:
    release: prometheus
    role: alert-rules
spec:
  groups:
    - name: inventory-app.availability
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{application="inventory-backend", status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{application="inventory-backend"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate on inventory-backend"
            description: "Error rate has been above 5% for 5 minutes ({{ $value | humanizePercentage }})."

        - alert: HighRequestLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket{application="inventory-backend"}[5m])) by (le, uri)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "p95 latency above 500ms on {{ $labels.uri }}"
            description: "95th percentile latency has exceeded the 500ms SLO target for 10 minutes."

    - name: inventory-app.resources
      rules:
        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="inventory-app"}[5m])) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="inventory-app", resource="cpu"}) by (pod)
            > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} CPU usage above 80%"
            description: "Container CPU usage has exceeded 80% of its limit for 10 minutes."

        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace="inventory-app"}) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="inventory-app", resource="memory"}) by (pod)
            > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} memory usage above 90%"

        - alert: PodRestartingFrequently
          expr: increase(kube_pod_container_status_restarts_total{namespace="inventory-app"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting frequently"
            description: "{{ $labels.pod }} has restarted more than 3 times in the last 15 minutes."

        - alert: DatabaseConnectionPoolExhaustion
          expr: |
            hikaricp_connections_active{application="inventory-backend"}
            /
            hikaricp_connections_max{application="inventory-backend"}
            > 0.9
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "HikariCP connection pool near exhaustion"
            description: "Active connections are above 90% of the configured max pool size."

    - name: inventory-app.business
      rules:
        - alert: LowStockProducts
          expr: inventory_low_stock_products_total > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} product(s) below reorder level"
            description: "Check /api/v1/products/low-stock for details. Consider raising a purchase order."

        - alert: PendingApprovalsBacklog
          expr: inventory_pending_approvals_total > 20
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "Pending approvals backlog is growing ({{ $value }})"
            description: "Stock adjustments awaiting manager approval have exceeded 20 for over an hour."
