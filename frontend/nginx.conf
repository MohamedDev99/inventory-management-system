# nginx.conf — Custom configuration for the MoeWare React SPA
# This file replaces /etc/nginx/conf.d/default.conf inside the container.

server {
    # Listen on port 80 (standard HTTP inside the container).
    # The actual host port is mapped via docker-compose (e.g., 3000:80).
    listen 80;

    # Accept requests for any hostname (localhost, IP, or domain).
    # In production, replace _ with your actual domain: moeware.com
    server_name _;

    # Root directory where our built React files live.
    # Nginx serves files from here for all incoming requests.
    root /usr/share/nginx/html;

    # The default file to serve when a directory is requested.
    index index.html;

    # ── SPA Routing (Critical for React Router) ──────────────────────────────
    # React Router handles navigation client-side (e.g., /products, /warehouses).
    # Without this block, refreshing /products would return a 404 because
    # there's no actual /products file on the server.
    # "try_files" tells Nginx:
    #   1. Try to serve the exact file ($uri)
    #   2. Try to serve it as a directory ($uri/)
    #   3. Fall back to /index.html (let React Router handle it)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static Asset Caching ─────────────────────────────────────────────────
    # Vite generates filenames with content hashes (e.g., main.a1b2c3.js).
    # These files never change content, so we can cache them aggressively.
    # "max-age=31536000" = 1 year, "immutable" tells browsers never to recheck.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Disable logging for static assets to reduce noise in access logs.
        access_log off;
    }

    # ── Gzip Compression ─────────────────────────────────────────────────────
    # Compress text-based responses before sending them to the browser.
    # Reduces bandwidth by 60-80% for JS, CSS, and HTML files.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;   # Only compress files larger than 1 KB
    gzip_comp_level 6;      # Compression level (1=fastest, 9=smallest)

    # ── Security Headers ─────────────────────────────────────────────────────
    # Prevent browsers from MIME-sniffing the content type.
    add_header X-Content-Type-Options "nosniff" always;
    # Prevent the page from being embedded in iframes (clickjacking protection).
    add_header X-Frame-Options "DENY" always;
    # Enable browser's built-in XSS protection.
    add_header X-XSS-Protection "1; mode=block" always;
    # Only send referrer info to same-origin requests.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
