---
# roles/common/tasks/main.yml
# Idempotent baseline server setup — safe to run repeatedly

# ── 1. Update & upgrade packages ─────────────────────────────
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600 # skip update if cache is less than 1h old

- name: Upgrade all packages to latest version
  ansible.builtin.apt:
    upgrade: dist
  register: apt_upgrade
  notify: Reboot if kernel updated

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# ── 2. Create non-root deploy user ───────────────────────────
- name: Create deploy group
  ansible.builtin.group:
    name: "{{ deploy_group }}"
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    shell: "{{ deploy_user_shell }}"
    create_home: true
    state: present

- name: Add deploy user to sudo group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: sudo
    append: true

- name: Allow deploy user to sudo without password
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/deploy
    line: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL"
    create: true
    validate: /usr/sbin/visudo -cf %s
    mode: "0440"

- name: Set authorized SSH key for deploy user
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    state: present
    key: "{{ lookup('file', '~/.ssh/moeware_deploy.pub') }}"

# ── 3. Harden SSH ────────────────────────────────────────────
- name: Harden SSH configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

# ── 4. Configure UFW firewall ────────────────────────────────
- name: Set UFW default policy — deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default policy — allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow configured ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allow_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

# ── 5. Configure fail2ban ────────────────────────────────────
- name: Configure fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

# ── 6. Configure timezone ────────────────────────────────────
- name: Set server timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

# ── 7. Configure swap ────────────────────────────────────────
- name: Check if swap file exists
  ansible.builtin.stat:
    path: /swapfile
  register: swap_file_stat

- name: Create swap file
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size_mb }}M /swapfile"
  when: not swap_file_stat.stat.exists and swap_size_mb > 0

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"
  when: swap_size_mb > 0

- name: Format swap file
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not swap_file_stat.stat.exists and swap_size_mb > 0

- name: Enable swap file
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: not swap_file_stat.stat.exists and swap_size_mb > 0

- name: Add swap to fstab (persist across reboots)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present
  when: swap_size_mb > 0

# ── 8. Configure automatic security updates ──────────────────
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# ── 9. Set up log rotation for app logs ──────────────────────
- name: Configure logrotate for app logs
  ansible.builtin.template:
    src: logrotate-app.j2
    dest: "/etc/logrotate.d/{{ app_name }}"
    owner: root
    group: root
    mode: "0644"
