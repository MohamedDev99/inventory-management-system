[defaults]
# Inventory location — override with -i flag if needed
inventory           = inventory/

# SSH key for all servers
private_key_file    = ~/.ssh/moeware_deploy

# Remote user (non-root deploy user created by common role)
remote_user         = deploy

# Disable host key checking in CI/CD — keep it enabled locally (set to True for production hardening)
host_key_checking   = False

# Number of parallel connections (increase for many servers)
forks               = 10

# Retry failed hosts in a .retry file
retry_files_enabled = True
retry_files_save_path = /tmp/ansible-retry

# Roles path — Ansible searches here for role names
roles_path          = roles

# Keep stdout clean in CI
stdout_callback     = yaml

# Log every run (useful for auditing)
log_path            = /tmp/ansible.log

# Show task timing at the end of each run
callback_whitelist  = timer, profile_tasks

[ssh_connection]
# Reuse SSH connections for speed (multiplexing)
pipelining          = True
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

[privilege_escalation]
# Default: become root via sudo (no password prompt — sudoers set up by common role)
become              = True
become_method       = sudo
become_user         = root
become_ask_pass     = False
