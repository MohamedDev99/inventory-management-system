---
# ─────────────────────────────────────────────────────────────
#  group_vars/prod/vault.yml
#
#  This file is ENCRYPTED with ansible-vault before committing.
#
#  To encrypt:   ansible-vault encrypt group_vars/prod/vault.yml
#  To edit:      ansible-vault edit   group_vars/prod/vault.yml
#  To decrypt:   ansible-vault decrypt group_vars/prod/vault.yml
#  To view:      ansible-vault view   group_vars/prod/vault.yml
#
#  Run playbooks with:
#    ansible-playbook site.yml --ask-vault-pass
#    # OR store password in a file (add to .gitignore):
#    ansible-playbook site.yml --vault-password-file ~/.vault_pass.txt
# ─────────────────────────────────────────────────────────────

