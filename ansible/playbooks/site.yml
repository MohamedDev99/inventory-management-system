---
# ─────────────────────────────────────────────────────────────
#  site.yml — Full server provisioning
#
#  Runs ALL four roles in order:
#    common → docker → nginx → app
#
#  Use this when:
#  - Setting up a brand new server
#  - Recovering a server from scratch
#
#  Usage:
#    ansible-playbook -i inventory/prod site.yml --ask-vault-pass
#    ansible-playbook -i inventory/staging site.yml --vault-password-file ~/.vault_pass.txt
# ─────────────────────────────────────────────────────────────

- name: Full server setup — MoeWare IMS
  hosts: webservers
  become: true

  pre_tasks:
    - name: Verify Ansible version
      ansible.builtin.assert:
        that: "ansible_version.full is version('2.12', '>=')"
        msg: "Ansible 2.12+ required. Current: {{ ansible_version.full }}"

    - name: Gather facts
      ansible.builtin.setup:

    - name: Print target info
      ansible.builtin.debug:
        msg: >
          Deploying to {{ inventory_hostname }}
          ({{ ansible_distribution }} {{ ansible_distribution_version }})
          in {{ env | upper }} environment

  roles:
    - role: common   # 1. Harden server, create deploy user, firewall
    - role: docker   # 2. Install Docker Engine + Compose
    - role: nginx    # 3. Install and configure Nginx reverse proxy
    - role: app      # 4. Deploy MoeWare IMS containers

  post_tasks:
    - name: Final health check
      ansible.builtin.uri:
        url: "http://localhost:{{ backend_port }}/actuator/health"
      register: final_check
      failed_when: final_check.status != 200

    - name: Deployment summary
      ansible.builtin.debug:
        msg: |
          ✓ MoeWare IMS — Full setup complete
            Environment : {{ env | upper }}
            Host        : {{ inventory_hostname }} ({{ ansible_host }})
            Backend     : http://localhost:{{ backend_port }}
            Frontend    : http://{{ nginx_server_name }}
