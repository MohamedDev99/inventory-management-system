# =============================================================================
# Frontend — Deployment + Service
# =============================================================================
# The frontend is a static React app served by Nginx.
# It's stateless and scales easily. 2 replicas for HA.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: inventory-app
  labels:
    app: moeware-frontend
    version: "1.0.0"
  annotations:
    kubernetes.io/change-cause: "Initial deployment"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: moeware-frontend
  template:
    metadata:
      labels:
        app: moeware-frontend
        version: "1.0.0"
    spec:
      imagePullSecrets:
        - name: regcred

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - moeware-frontend
                topologyKey: kubernetes.io/hostname

      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # nginx user
        fsGroup: 101

      containers:
        - name: frontend
          image: yourdockerhub/inventory-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
              protocol: TCP

          # Mount the Nginx config from ConfigMap as a file
          # This overrides the default nginx.conf inside the image
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf    # Mount only this key as a file, not the whole ConfigMap

          # Inject frontend env vars
          envFrom:
            - configMapRef:
                name: frontend-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # Nginx serves static files — it starts near-instantly
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Nginx writes PID and cache files

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

      terminationGracePeriodSeconds: 15

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: inventory-app
  labels:
    app: moeware-frontend
spec:
  type: ClusterIP
  selector:
    app: moeware-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80