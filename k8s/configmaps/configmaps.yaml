# =============================================================================
# ConfigMap - Non-sensitive configuration
# =============================================================================
# ConfigMaps store configuration data as key-value pairs.
# They're injected into containers as environment variables or mounted as files.
# Rule of thumb: if it's not a secret, it goes in a ConfigMap.
# If it IS sensitive (passwords, API keys), it goes in a Secret.
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: inventory-app
  labels:
    app: moeware-backend
    component: config
data:
  # Spring Boot active profile
  SPRING_PROFILES_ACTIVE: "prod"

  # Database connection (host/port/name are NOT secrets)
  DB_HOST: "postgres-service"     # The Service name — K8s DNS resolves this automatically
  DB_PORT: "5432"
  DB_NAME: "inventory_db"

  # Application settings
  SERVER_PORT: "8080"
  APP_NAME: "MoeWare IMS"
  APP_VERSION: "1.0.0"

  # JWT settings (expiry is not a secret)
  JWT_EXPIRATION: "3600000"       # 1 hour in milliseconds
  REFRESH_TOKEN_EXPIRY: "604800000" # 7 days in milliseconds

  # Flyway (database migrations)
  FLYWAY_BASELINE_ON_MIGRATE: "true"
  FLYWAY_LOCATIONS: "classpath:db/migration"

  # HikariCP connection pool settings
  DB_POOL_MAX_SIZE: "20"
  DB_POOL_MIN_IDLE: "5"
  DB_POOL_TIMEOUT: "30000"

  # File upload (S3)
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "moeware-inventory-uploads"

  # Logging
  LOG_LEVEL: "INFO"
  LOG_LEVEL_SQL: "WARN"          # Set to DEBUG to see SQL queries (dev only)

  # Pagination defaults
  DEFAULT_PAGE_SIZE: "20"
  MAX_PAGE_SIZE: "100"

  # Low stock check job schedule (cron expression)
  LOW_STOCK_CHECK_CRON: "0 0 * * * *"  # Every hour

---

# ConfigMap for frontend (Nginx serves this as env vars injected at runtime)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: inventory-app
  labels:
    app: moeware-frontend
    component: config
data:
  # These get injected into window.__ENV__ by the nginx startup script
  VITE_API_BASE_URL: "https://api.moeware.com/api/v1"
  VITE_APP_NAME: "MoeWare IMS"
  VITE_APP_VERSION: "1.0.0"
  VITE_ENVIRONMENT: "production"

---

# Nginx configuration for the frontend (mounted as a file, not env vars)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: inventory-app
  labels:
    app: moeware-frontend
    component: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        # Logging format
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent"';

        access_log /var/log/nginx/access.log main;

        sendfile        on;
        keepalive_timeout 65;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json
                   application/javascript application/xml+rss
                   application/atom+xml image/svg+xml;

        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;

            # SPA routing — all routes fall back to index.html
            # Without this, refreshing /products would return 404
            location / {
                try_files $uri $uri/ /index.html;
            }

            # Cache static assets aggressively (they have content hashes in names)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            # Never cache the HTML entry point
            location = /index.html {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }

            # Health check endpoint for Kubernetes probes
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }