# =============================================================================
# CronJobs — Scheduled tasks inside Kubernetes
# =============================================================================
# K8s CronJobs use standard Unix cron syntax:
#   ┌───── minute (0-59)
#   │ ┌───── hour (0-23)
#   │ │ ┌───── day of month (1-31)
#   │ │ │ ┌───── month (1-12)
#   │ │ │ │ ┌───── day of week (0-6, 0=Sunday)
#   │ │ │ │ │
#   * * * * *
#
# The CronJob creates a Job at each scheduled time.
# The Job creates a Pod to run the task.
# =============================================================================

# Daily stock valuation report at 2 AM
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-stock-valuation
  namespace: inventory-app
  labels:
    app: moeware-jobs
    job-type: report
spec:
  schedule: "0 2 * * *"           # At 02:00 every day
  timeZone: "America/New_York"    # K8s 1.27+ supports timezone
  concurrencyPolicy: Forbid        # Don't run if previous job still running
  successfulJobsHistoryLimit: 3    # Keep last 3 successful job records
  failedJobsHistoryLimit: 5        # Keep last 5 failed job records

  jobTemplate:
    spec:
      # Retry up to 2 times on failure
      backoffLimit: 2
      # Kill the job if it runs more than 10 minutes
      activeDeadlineSeconds: 600

      template:
        metadata:
          labels:
            app: moeware-jobs
            job-type: report
        spec:
          restartPolicy: OnFailure    # CronJob pods must use OnFailure or Never
          imagePullSecrets:
            - name: regcred
          containers:
            - name: report-generator
              image: yourdockerhub/inventory-backend:latest
              command:
                - java
                - -jar
                - /app/app.jar
                - --spring.batch.job.name=stockValuationJob
              envFrom:
                - configMapRef:
                    name: backend-config
                - secretRef:
                    name: backend-secrets
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"

---

# Low stock alert check every hour
apiVersion: batch/v1
kind: CronJob
metadata:
  name: low-stock-check
  namespace: inventory-app
  labels:
    app: moeware-jobs
    job-type: alert
spec:
  schedule: "0 * * * *"           # At the top of every hour
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300   # 5 minutes max
      template:
        metadata:
          labels:
            app: moeware-jobs
            job-type: alert
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: regcred
          containers:
            - name: low-stock-checker
              image: yourdockerhub/inventory-backend:latest
              command:
                - java
                - -jar
                - /app/app.jar
                - --spring.batch.job.name=lowStockAlertJob
              envFrom:
                - configMapRef:
                    name: backend-config
                - secretRef:
                    name: backend-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "250m"
                  memory: "512Mi"

