# Monthly inventory reconciliation — 1st of each month at 1 AM
apiVersion: batch/v1
kind: CronJob
metadata:
  name: monthly-reconciliation
  namespace: inventory-app
  labels:
    app: moeware-jobs
    job-type: reconciliation
spec:
  schedule: "0 1 1 * *"           # At 01:00 on the 1st of every month
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600  # 1 hour max
      template:
        metadata:
          labels:
            app: moeware-jobs
            job-type: reconciliation
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: regcred
          containers:
            - name: reconciliation
              image: yourdockerhub/inventory-backend:latest
              command:
                - java
                - -jar
                - /app/app.jar
                - --spring.batch.job.name=monthlyReconciliationJob
              envFrom:
                - configMapRef:
                    name: backend-config
                - secretRef:
                    name: backend-secrets
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "1000m"
                  memory: "2Gi"