# Database backup every night at 3 AM
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: inventory-app
  labels:
    app: moeware-jobs
    job-type: backup
spec:
  schedule: "0 3 * * *"           # At 03:00 every day
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7    # Keep a week of backup job records
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800  # 30 minutes max for backup
      template:
        metadata:
          labels:
            app: moeware-jobs
            job-type: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: db-backup
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -c
                - |
                  # Create a timestamped dump and upload to S3
                  FILENAME="inventory-db-backup-$(date +%Y%m%d-%H%M%S).sql.gz"
                  echo "Starting backup: $FILENAME"

                  pg_dump \
                    -h postgres-service \
                    -U $POSTGRES_USER \
                    -d $POSTGRES_DB \
                    --no-password \
                    | gzip > /tmp/$FILENAME

                  echo "Backup complete, uploading to S3..."

                  # Upload to S3 (requires aws CLI in image or use aws-cli image)
                  # In real scenario, use a custom image with both pg_dump and aws CLI
                  aws s3 cp /tmp/$FILENAME s3://moeware-db-backups/daily/$FILENAME

                  echo "Upload complete: s3://moeware-db-backups/daily/$FILENAME"

              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: POSTGRES_DB
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: POSTGRES_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "250m"
                  memory: "256Mi"

